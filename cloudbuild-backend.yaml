# Deploy the classroom demo backend. SQLite is ephemeral on Cloud Run.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-backend:$BUILD_ID', './backend']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-backend:$BUILD_ID']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - run
      - deploy
      - recipe-backend
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-backend:$BUILD_ID'
      - '--project=$PROJECT_ID'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=5000'
      - '--min-instances=0'
      - '--max-instances=1'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--quiet'
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-backend:$BUILD_ID'
options:
  logging: CLOUD_LOGGING_ONLY
